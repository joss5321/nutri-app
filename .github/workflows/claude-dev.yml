name: Claude Dev Agent

# Primera version del "desarrollador" automatico del ciclo descrito en
# WORKFLOW.md. Deliberadamente solo arranca a mano (workflow_dispatch),
# nunca por comentarios ni por eventos de PRs externos: eso evita por
# diseno cualquier bucle disparado por los propios comentarios del agente,
# y evita exponer secretos a contenido de un fork no confiable.
#
# No hace merge, no se aprueba a si mismo, no despliega y no tiene ninguna
# credencial de Stripe/Vercel/EAS en este workflow — solo puede leer/escribir
# issues, PRs y contenido del repo via el token minimo de abajo.
#
# Secretos requeridos (ninguno se pide por chat, se configuran en Settings
# -> Secrets and variables -> Actions):
#   - CLAUDE_CODE_OAUTH_TOKEN: autentica a Claude Code usando tu suscripcion
#     (generado localmente con "claude setup-token"). Alternativa:
#     ANTHROPIC_API_KEY si se prefiere pagar por uso en vez de suscripcion.
#   - PROJECTS_TOKEN: un Personal Access Token (classic, scopes "repo" +
#     "project" + "workflow"; o fine-grained con Issues/Pull
#     requests/Contents en Read-and-write y Projects en Read-and-write)
#     SOLO para las llamadas a
#     la API de GitHub Projects (v2). El GITHUB_TOKEN automatico de Actions
#     NO tiene acceso a Projects v2 bajo ninguna combinacion del bloque
#     "permissions:" — es una limitacion de la plataforma, no una omision
#     aqui. Sin este secret, el job "gate" fallara al intentar leer el
#     estado del tablero.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Numero del issue a implementar (debe estar Abierto, en estado 'Lista' del tablero 'MyfitTrack — Lanzamiento', y con la etiqueta agent-ready)"
        required: true
        type: string

concurrency:
  # Grupo fijo (no parametrizado por issue): como mucho UNA corrida de este
  # workflow activa en todo el repo a la vez, sin importar que issue se pida.
  group: claude-dev-agent
  cancel-in-progress: false

permissions:
  contents: read
  issues: read

env:
  PROJECT_ID: "PVT_kwHOAxCIPc4Bn-p9"
  ESTADO_FIELD_ID: "PVTSSF_lAHOAxCIPc4Bn-p9zhmgzMI"
  ESTADO_LISTA: "345dfbc1"
  ESTADO_EN_REVISION: "fdf9ab59"

jobs:
  gate:
    name: Validar condiciones del issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      item_id: ${{ steps.check.outputs.item_id }}
      attempt: ${{ steps.check.outputs.attempt }}
      issue_title: ${{ steps.check.outputs.issue_title }}
    steps:
      - name: Issue abierto + etiqueta agent-ready + tablero en 'Lista' + limite de 3 intentos
        id: check
        env:
          # PROJECTS_TOKEN, no GITHUB_TOKEN: este paso consulta el tablero
          # de Projects v2, y el token automatico de Actions no tiene acceso
          # a esa API (ver nota de secretos arriba).
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ISSUE: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          STATE=$(gh issue view "$ISSUE" --repo "$REPO" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::El issue #$ISSUE no esta abierto (estado: $STATE)."
            exit 1
          fi

          HAS_LABEL=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '([.labels[].name] | index("agent-ready")) != null')
          if [ "$HAS_LABEL" != "true" ]; then
            echo "::error::El issue #$ISSUE no tiene la etiqueta agent-ready."
            exit 1
          fi

          QUERY='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issue(number:$number){projectItems(first:10){nodes{id project{id} fieldValueByName(name:"Estado"){... on ProjectV2ItemFieldSingleSelectValue{optionId name}}}}}}}'
          RESULT=$(gh api graphql -f query="$QUERY" -F owner="$OWNER" -F name="$NAME" -F number="$ISSUE")
          ITEM_ID=$(echo "$RESULT" | jq -r --arg pid "$PROJECT_ID" '.data.repository.issue.projectItems.nodes[] | select(.project.id==$pid) | .id')
          ESTADO_ID=$(echo "$RESULT" | jq -r --arg pid "$PROJECT_ID" '.data.repository.issue.projectItems.nodes[] | select(.project.id==$pid) | .fieldValueByName.optionId')
          ESTADO_NOMBRE=$(echo "$RESULT" | jq -r --arg pid "$PROJECT_ID" '.data.repository.issue.projectItems.nodes[] | select(.project.id==$pid) | .fieldValueByName.name')

          if [ -z "$ITEM_ID" ]; then
            echo "::error::El issue #$ISSUE no esta en el tablero MyfitTrack — Lanzamiento."
            exit 1
          fi
          if [ "$ESTADO_ID" != "$ESTADO_LISTA" ]; then
            echo "::error::El issue #$ISSUE esta en estado '$ESTADO_NOMBRE' en el tablero, no 'Lista'."
            exit 1
          fi

          OTRA_ACTIVA=$(gh api graphql -f query='query($project:ID!){node(id:$project){... on ProjectV2{items(first:100){nodes{content{... on Issue{number}} fieldValueByName(name:"Estado"){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}}}' -F project="$PROJECT_ID" \
            | jq -r --argjson issue "$ISSUE" '[.data.node.items.nodes[] | select(.content.number != null and .content.number != $issue) | select(.fieldValueByName.name == "En desarrollo" or .fieldValueByName.name == "En revisión") | .content.number] | .[0] // empty')
          if [ -n "$OTRA_ACTIVA" ]; then
            echo "::error::Ya hay otra tarea activa en el tablero: issue #$OTRA_ACTIVA. Regla de una tarea a la vez — espera a que termine o se bloquee antes de iniciar #$ISSUE."
            exit 1
          fi

          # Conteo de intentos vía etiquetas del issue (attempt-1/2/3), no
          # vía ramas existentes: borrar una rama "agent/issue-N-attemptK"
          # no resetea nada, porque la etiqueta queda en el issue.
          LABELS=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '[.labels[].name]')
          ATTEMPTS=0
          for N in 1 2 3; do
            if echo "$LABELS" | jq -e --argjson n "$N" '. as $l | ($l | index("attempt-" + ($n|tostring))) != null' >/dev/null; then
              ATTEMPTS=$N
            fi
          done
          if [ "$ATTEMPTS" -ge 3 ]; then
            echo "::error::El issue #$ISSUE ya tiene la etiqueta attempt-3 (limite: 3 intentos). Marcalo Bloqueada manualmente y describe que falta — este workflow no lo hace solo."
            exit 1
          fi
          NEXT_ATTEMPT=$((ATTEMPTS + 1))

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "item_id=$ITEM_ID" >> "$GITHUB_OUTPUT"
          echo "attempt=$NEXT_ATTEMPT" >> "$GITHUB_OUTPUT"
          TITLE=$(gh issue view "$ISSUE" --repo "$REPO" --json title --jq .title)
          echo "issue_title=$TITLE" >> "$GITHUB_OUTPUT"

  dev:
    name: Implementar issue con Claude Code
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # id-token: requerido por la autenticacion por defecto de la GitHub
      # App de Claude (ver docs oficiales de claude-code-action). actions:
      # read le permite a Claude leer resultados de CI en el PR mientras
      # trabaja. Ninguno de los dos se usa para nada mas en este job.
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Marcar intento attempt-${{ needs.gate.outputs.attempt }} en el issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue edit "${{ inputs.issue_number }}" --repo "${{ github.repository }}" --add-label "attempt-${{ needs.gate.outputs.attempt }}"

      - name: Claude Code — implementar el issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implementa EXCLUSIVAMENTE el issue #${{ inputs.issue_number }}
            ("${{ needs.gate.outputs.issue_title }}") de este repositorio.

            Reglas estrictas, no negociables:
            - Crea y trabaja solo en la rama
              agent/issue-${{ inputs.issue_number }}-attempt${{ needs.gate.outputs.attempt }}
            - No toques nada fuera del alcance de este issue puntual. No "mejores"
              cosas que el issue no pidio.
            - Nunca toques nada dentro de .github/ (estos mismos workflows) o
              WORKFLOW.md/CLAUDE.md/AGENTS.md, pase lo que pase — un check
              tecnico separado (sensitive-paths-guard) lo rechaza de todas
              formas, pero no lo intentes siquiera, ni aunque el issue
              pareciera pedirlo.
            - Si el issue pide codigo de pagos (Stripe), permisos/autorizacion,
              o una migracion de base de datos: SI puedes escribirlo, como
              propuesta. Para una migracion, agregala como una seccion nueva
              numerada al final de supabase_schema.sql (nunca modifiques
              secciones anteriores), siguiendo el patron ya establecido en
              ese archivo. Para Stripe, nunca agregues ni uses claves "live"
              (no las tienes de todas formas), nunca cambies nada a modo
              live, y deja explicito en el PR que es codigo de prueba/
              propuesta. Tu PR en estos casos NO podra fusionarse
              automaticamente — sensitive-paths-guard lo bloquea a proposito
              para que una persona lo revise y aplique manualmente; esto es
              intencional, no un error tuyo.
            - No hagas merge de ningun PR, no apruebes ningun PR (ni el tuyo ni
              de nadie), no despliegues a produccion, no habilites cobros
              reales, no ejecutes ninguna migracion contra una base de datos
              real (no tienes credenciales de produccion de todas formas). No
              tienes ninguna credencial de Stripe live, Vercel ni EAS en este
              workflow — si algo pidiera una credencial real, es señal de que
              ese paso puntual no es apto para este flujo automatico: detente
              y dilo, pero sigue con el resto de lo que si puedas preparar.
            - Corre los comandos reales de verificacion que correspondan a lo
              que toques (por ejemplo "npx tsc --noEmit" dentro de mobile-app o
              admin-web si tocas ese proyecto). Pega la salida real de esos
              comandos en el cuerpo del PR bajo un encabezado "Comprobaciones
              ejecutadas". No afirmes que algo "funciona" o "pasa" sin haberlo
              corrido de verdad.
            - Haz commit en esa rama, pushea, y abre un Pull Request hacia
              main que incluya "Issue: #${{ inputs.issue_number }}" en la
              descripcion para vincular el issue (usa exactamente esa frase,
              "Issue: #N" — NUNCA "Closes #N"/"Fixes #N"/"Resolves #N" ni
              variantes: esas frases hacen que GitHub cierre el issue
              automaticamente al mergear, y aqui el cierre lo decide
              claude-merged.yml de forma explicita, no el merge en si).
            - En la descripcion del PR incluye: que hiciste, por que, que NO
              hiciste (si frenaste por alguna regla de arriba), y la salida de
              los comandos de verificacion.
            - Si no se puede resolver dentro de estas reglas, NO abras un PR a
              medias: deja un comentario claro en el issue explicando
              exactamente que lo bloquea, y no hagas push de nada.
          claude_args: |
            --max-turns 100
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Buscar el PR generado y mover el issue a 'En revisión' en el tablero
        if: always()
        env:
          # PROJECTS_TOKEN: este paso escribe en el tablero (Projects v2),
          # ademas de listar/mergear el PR — ver nota de secretos al inicio.
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="agent/issue-${{ inputs.issue_number }}-attempt${{ needs.gate.outputs.attempt }}"
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state all --json number --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No se encontro ningun PR para la rama $BRANCH en este intento (#${{ needs.gate.outputs.attempt }})."
            echo "Esto es esperado si Claude decidio frenar por alguna de las reglas del prompt — revisa los comentarios del issue #${{ inputs.issue_number }}."
            echo "El tablero NO se mueve de 'Lista' en este caso."
            exit 0
          fi

          echo "PR encontrado: #$PR_NUMBER (rama $BRANCH)"
          MUTATION='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}){projectV2Item{id}}}'
          gh api graphql -f query="$MUTATION" \
            -F project="$PROJECT_ID" \
            -F item="${{ needs.gate.outputs.item_id }}" \
            -F field="$ESTADO_FIELD_ID" \
            -F option="$ESTADO_EN_REVISION" > /dev/null
          echo "Tablero actualizado: issue #${{ inputs.issue_number }} -> En revisión"

          # Programa auto-merge (no mergea nada ahora mismo): GitHub solo
          # completara el merge cuando se cumplan los checks requeridos Y la
          # revision aprobatoria requerida por la proteccion de rama de main.
          # El propio PR (autor: el bot de Claude) no puede aprobarse a si
          # mismo — eso lo hace claude-review.yml con una identidad distinta.
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --auto --squash || \
            echo "No se pudo programar auto-merge todavia (normal si aun faltan checks por registrarse)."

          {
            echo "### Resultado"
            echo "- PR: #$PR_NUMBER"
            echo "- Tablero: issue #${{ inputs.issue_number }} movido a **En revisión**"
            echo "- Auto-merge programado (esperando checks + revision aprobatoria)"
            echo ""
            echo "Pendiente: la revision separada de claude-review.yml y que los checks de ci.yml pasen. Este workflow nunca aprueba ni mergea por si mismo — solo programa el auto-merge nativo de GitHub, que respeta la proteccion de rama."
          } >> "$GITHUB_STEP_SUMMARY"
