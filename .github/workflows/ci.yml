name: CI

# Corre en cada PR hacia main. No usa secretos de produccion: las claves de
# Supabase que usa admin-web en runtime son el "publishable key" publico
# (issue #12 — movido de hardcodeado en el codigo a NEXT_PUBLIC_SUPABASE_URL/
# _ANON_KEY via env, con el mismo valor publico repetido aqui porque no es un
# secreto), y las pruebas de RLS levantan su propio Supabase local via Docker.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sensitive-paths-guard:
    name: sensitive-paths-guard
    # Solo se aplica a PRs del ciclo automatico (rama agent/issue-*). Nunca
    # restringe el trabajo humano normal en estos mismos archivos — es un
    # control tecnico, no solo una instruccion de prompt, para que el
    # agente no pueda tocar pagos/permisos/migraciones aunque algo en su
    # contexto lo empuje a intentarlo.
    #
    # Incluye .github/ (estos mismos workflows) y WORKFLOW.md/CLAUDE.md/
    # AGENTS.md a proposito: el ciclo automatico no puede modificar sus
    # propias reglas, limites o permisos via su propio circuito de
    # auto-merge. Como este check es requerido en la proteccion de rama de
    # main, un PR del agente que toque estas rutas queda bloqueado sin
    # intervencion humana explicita (merge por bypass de administrador).
    if: startsWith(github.head_ref, 'agent/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verificar que el diff no toque rutas sensibles
        run: |
          set -euo pipefail
          DIFF=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$DIFF"
          PATRON='supabase_schema\.sql|supabase_stripe_schema\.sql|supabase/functions/|supabase/migrations/|lib/permissions\.ts|LockedModal|stripe|pago|^\.github/|WORKFLOW\.md|CLAUDE\.md|AGENTS\.md'
          MATCH=$(echo "$DIFF" | grep -iE "$PATRON" || true)
          if [ -n "$MATCH" ]; then
            echo "::error::Este PR automatico toca ruta(s) fuera de lo permitido (pagos/permisos/migraciones/workflows/config de agentes):"
            echo "$MATCH"
            exit 1
          fi
          echo "OK: ninguna ruta sensible tocada."

  mobile-app:
    name: mobile-app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint
        # eslint ya esta instalado (PR #68) y hoy pasa limpio (0 errores,
        # solo warnings de react-hooks/exhaustive-deps preexistentes que no
        # se "arreglan" a ciegas agregando dependencias sin revisar cada
        # caso — podria crear loops infinitos). Confirmado en vivo
        # (2026-11-06) y corregidos los 2 errores reales que quedaban
        # (react/no-unescaped-entities en nutricion.tsx) antes de quitar
        # este continue-on-error.
        run: npm run lint

      - name: Build check (expo export --platform ios)
        # El target real de esta app es iOS/Android (eas.json no tiene
        # ningun perfil "web"; app.json trae "web" solo porque Expo Router
        # lo agrega por defecto, nunca se despliega). Antes este paso
        # corria "--platform web", que falla con "window is not defined"
        # durante el prerenderizado estatico (src/lib/supabase.ts usa
        # AsyncStorage) — un bug real, pero de un target que la app nunca
        # usa, probando nada relevante. Confirmado en vivo (2026-11-06):
        # "--platform ios" y "--platform android" exportan limpio los dos,
        # sin ese error, porque ninguno pasa por el prerenderizado web.
        run: npx expo export --platform ios

      - name: Build check (expo export --platform android)
        run: npx expo export --platform android

      - name: Verificar texto en español del permiso de fotos (iOS)
        # Issue #17. "expo config" resuelve la config efectiva incluyendo
        # config plugins — es exactamente lo que "expo prebuild" usaria
        # para generar el Info.plist real, sin necesitar una build nativa
        # completa (no hay runner macOS en este repo). Determinista: si
        # este valor es correcto, el Info.plist generado lo sera tambien.
        run: |
          set -euo pipefail
          TEXTO=$(npx expo config --type public --json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for p in d.get('plugins', []):
              if isinstance(p, list) and 'image-picker' in str(p[0]):
                  print(p[1].get('photosPermission', ''))
          ")
          echo "Texto configurado: $TEXTO"
          echo "$TEXTO" | grep -qi "fotos" || { echo "::error::El texto del permiso de fotos no esta en español (o el plugin no esta configurado)."; exit 1; }

  admin-web:
    name: admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    env:
      # Publishable key, no es secreto (issue #12) — ver comentario de
      # cabecera de este archivo.
      NEXT_PUBLIC_SUPABASE_URL: https://uvfdbvzydbogfkntfuix.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_E-hr1YBueC-gkt_w2c_AAg_JOcDMAsl
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        # Quedan 10 errores reales (2026-11-06), todos de las reglas nuevas
        # de React Compiler (react-hooks/set-state-in-effect, purity,
        # static-components) sobre el patron clasico "cargar datos en
        # useEffect" — no son bugs confirmados, pero arreglarlos bien
        # requiere revisar cada componente por separado, no un cambio
        # mecanico masivo sobre forms que ya maneja datos reales de
        # pacientes. Bajaron de 11 a 10 (mas 2 warnings de unused-vars
        # resueltos) en esta pasada. Ver issue de seguimiento. Mientras
        # tanto se deja visible, no bloqueante — no se enmascara pretendiendo
        # que ya esta resuelto.
        run: npm run lint
        continue-on-error: true
        continue-on-error: true

      - name: Build (next build — incluye el type-check de Next.js)
        run: npm run build

  e2e-admin-web:
    name: e2e-admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://uvfdbvzydbogfkntfuix.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_E-hr1YBueC-gkt_w2c_AAg_JOcDMAsl
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas e2e (build de produccion real, sin tocar datos reales)
        # Usa "next build && next start" (no "next dev"): el cliente de HMR
        # de Turbopack en modo dev bloquea la hidratacion de React en este
        # tipo de entorno sandboxeado (confirmado en vivo), ademas de que
        # probar contra un build real es mas representativo. Las pruebas
        # interceptan las llamadas a Supabase con page.route(), nunca pegan
        # a la base de datos real.
        run: npm run test:e2e

  rls-tests:
    name: rls-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # El contexto "secrets" no se puede leer directamente en un "if:" de
      # step (GitHub Actions lo rechaza con "Unrecognized named-value:
      # 'secrets'" al evaluar el workflow) — eso invalidaba TODO este
      # archivo para TODOS los eventos, no solo este job. Se pasa primero
      # por "env" a nivel de job, que si es legible desde el "if:" de un
      # step.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias (raiz)
        run: npm ci

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login a Docker Hub (evita el rate-limit anonimo)
        # Hallazgo real en esta sesion: "supabase start" baja ~8-10 imagenes
        # (postgres, kong, gotrue, postgrest, storage-api, etc.) por corrida;
        # con suficiente actividad de CI en el dia, el limite anonimo de
        # Docker Hub por IP se agota de verdad ("toomanyrequests: Rate
        # exceeded"), bloqueando este check requerido. Login con una cuenta
        # gratuita sube el limite considerablemente. Si los secrets no estan
        # configurados, este paso no falla el job (continue-on-error) — solo
        # significa que se sigue corriendo sin autenticar, como antes.
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pruebas RLS (pgTAP) — 100% local vía Docker, sin secretos
        run: npm run test:rls
