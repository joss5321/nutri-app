name: Claude Triage

# El "coordinador" no solo despacha — tambien prepara el backlog, para que
# nadie tenga que etiquetar ni mover tareas a mano. Corre cada 6 horas (es
# una pasada de juicio/criterio, no logica pura como claude-coordinator.yml,
# asi que usa el modelo — se espacia mas que el despachador para no gastar
# de mas revisando lo mismo una y otra vez).
#
# Diseno de seguridad deliberado: Claude SOLO puede leer issues y escribir
# etiquetas/comentarios/sub-issues (via la identidad de la GitHub App,
# igual que claude-dev.yml — sin Write/Edit, y sin ningun token con alcance
# de Projects). Mover el tablero de 'Pendiente' a 'Lista' lo hace un paso
# DETERMINISTICO separado (bash puro, sin modelo), que simplemente mira que
# issues tienen la etiqueta agent-ready y los mueve — Claude nunca toca el
# tablero directamente ni tiene un token con ese privilegio. Esto evita
# darle a un paso con Bash (que SI puede escribir archivos via redireccion,
# aunque no tenga las herramientas Write/Edit) un token de alcance amplio.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: claude-triage
  cancel-in-progress: false

env:
  PROJECT_ID: "PVT_kwHOAxCIPc4Bn-p9"
  ESTADO_FIELD_ID: "PVTSSF_lAHOAxCIPc4Bn-p9zhmgzMI"
  ESTADO_PENDIENTE: "c0cbfebb"
  ESTADO_LISTA: "345dfbc1"

jobs:
  decidir:
    name: Claude decide que esta listo (solo etiqueta, no toca el tablero)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Listar issues Pendiente
        id: pendientes
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          IDS=$(gh api graphql -f query='query($project:ID!){node(id:$project){... on ProjectV2{items(first:100){nodes{content{... on Issue{number}} fieldValueByName(name:"Estado"){... on ProjectV2ItemFieldSingleSelectValue{optionId}}}}}}}' -F project="$PROJECT_ID" \
            | jq -r --arg pid "$ESTADO_PENDIENTE" '[.data.node.items.nodes[] | select(.fieldValueByName.optionId==$pid) | .content.number] | map(select(. != null)) | join(",")')
          echo "numbers=$IDS" >> "$GITHUB_OUTPUT"
          echo "Pendientes: $IDS"

      - name: Claude Code — triage del backlog (solo etiquetas/comentarios/sub-issues)
        if: steps.pendientes.outputs.numbers != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Eres el coordinador de preparacion del backlog de MyFitTrack.
            Los issues en estado 'Pendiente' del tablero (numeros:
            ${{ steps.pendientes.outputs.numbers }}) son candidatos.

            Para CADA UNO, en orden, decide si esta listo para que el
            desarrollador automatico lo tome:

            1. Lee el issue completo: `gh issue view <N>`.
            2. Verifica que tenga un criterio de aceptacion CONCRETO y
               objetivamente verificable (no una pregunta abierta ni una
               decision de negocio sin resolver).
            3. Si el issue dice "Depende de #X", verifica que el #X este
               cerrado: `gh issue view X --json state`. Si no, sigue con
               el siguiente sin hacer nada en este.
            4. Verifica que este dentro del alcance permitido: codigo de
               mobile-app o admin-web, documentacion, o codigo de
               Stripe/permisos/migraciones preparado como PROPUESTA (nunca
               cobros reales, nunca ejecutar una migracion real). NO esta
               en alcance: decisiones puramente de negocio (nombre de
               marca, modelo de precios), tareas que requieren una
               credencial o activo real que no existe en este repo (cuenta
               de Play Console, logo, etc.), o tareas que requieren
               interactuar con un dashboard externo real (Stripe,
               Supabase, Sentry) en vivo.
            5. Si el issue es grande (toca muchos archivos o mezcla cosas
               de riesgo distinto — por ejemplo UI de bajo riesgo + logica
               de borrado de datos), divide: crea 1-3 sub-issues mas
               chicos con `gh issue create`, cada uno con su propio
               criterio de aceptacion concreto y "Parte de #<N>" en el
               cuerpo, y comenta en el issue original explicando la
               division. No agregues la etiqueta agent-ready al issue
               original en ese caso.
            6. Si el issue SI esta listo (criterio claro + dependencias
               resueltas + dentro de alcance): agrega la etiqueta
               `gh issue edit <N> --add-label "agent-ready"`. NO intentes
               mover nada en el tablero de Projects — un paso separado del
               workflow se encarga de eso automaticamente en cuanto veas
               la etiqueta puesta.
            7. Si el issue NO esta listo por falta de un dato/credencial/
               decision humana (no por ser grande): deja un comentario
               corto y concreto (`gh issue comment <N> --body "..."`)
               diciendo exactamente que falta. No agregues ninguna
               etiqueta en ese caso.

            Reglas estrictas:
            - No escribas ni edites ningun archivo de codigo del repo bajo
              ninguna circunstancia — ni con Bash, ni creando ni
              modificando archivos. Tu unica salida son comandos `gh
              issue`/`gh api` de lectura o de escritura sobre issues
              (nunca sobre Projects/tablero).
            - Nunca toques .github/, WORKFLOW.md, CLAUDE.md ni AGENTS.md,
              ni para "mejorarlos", ni para leerlos con otro fin que
              entender las reglas.
            - No apruebes, mergees ni cierres ningun PR o issue.
          claude_args: |
            --max-turns 80
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Glob,Grep"

  mover_a_lista:
    name: Mover a Lista los issues que quedaron etiquetados (paso deterministico)
    needs: decidir
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mover
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NUMS=$(gh issue list --repo "$REPO" --label "agent-ready" --state open --json number --jq '.[].number')
          for NUM in $NUMS; do
            OWNER="${REPO%/*}"; NAME="${REPO#*/}"
            QUERY='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issue(number:$number){projectItems(first:10){nodes{id project{id} fieldValueByName(name:"Estado"){... on ProjectV2ItemFieldSingleSelectValue{optionId}}}}}}}'
            RESULT=$(gh api graphql -f query="$QUERY" -F owner="$OWNER" -F name="$NAME" -F number="$NUM")
            ITEM_ID=$(echo "$RESULT" | jq -r --arg pid "$PROJECT_ID" '.data.repository.issue.projectItems.nodes[] | select(.project.id==$pid) | .id')
            ESTADO_ID=$(echo "$RESULT" | jq -r --arg pid "$PROJECT_ID" '.data.repository.issue.projectItems.nodes[] | select(.project.id==$pid) | .fieldValueByName.optionId')
            if [ "$ESTADO_ID" = "$ESTADO_PENDIENTE" ]; then
              MUTATION='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}){projectV2Item{id}}}'
              gh api graphql -f query="$MUTATION" -F project="$PROJECT_ID" -F item="$ITEM_ID" -F field="$ESTADO_FIELD_ID" -F option="$ESTADO_LISTA" > /dev/null
              echo "Issue #$NUM: Pendiente -> Lista"
            fi
          done
