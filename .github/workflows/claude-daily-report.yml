name: Claude Daily Report

# Resumen diario del ciclo automatico. No manda nada a servicios externos
# (nunca se configuro Slack/email/etc., tal como se pidio) — publica un
# comentario nuevo cada dia en el issue #53 ("Resumen diario del ciclo
# automatico"), usando el tablero y el registro real de corridas de los
# workflows como unicas fuentes. No invoca a Claude: es logica
# deterministica (bash + gh api).
on:
  schedule:
    - cron: "0 13 * * *" # 07:00 hora de Ciudad de Mexico (UTC-6)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

env:
  PROJECT_ID: "PVT_kwHOAxCIPc4Bn-p9"
  REPORT_ISSUE: "53"

jobs:
  report:
    name: Generar y publicar el resumen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Construir y publicar el resumen
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          HOY=$(date -u +"%Y-%m-%d")
          DESDE=$(date -u -d "24 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          # ── Tablero: conteo por estado ──────────────────────────────
          # 100 es el maximo permitido por pagina en la API de GitHub
          # (un "first" mayor lo rechaza). Si el tablero llega a superar
          # 100 items habria que paginar con "after" — no es el caso hoy.
          ITEMS=$(gh api graphql -f query='query($project:ID!){node(id:$project){... on ProjectV2{items(first:100){nodes{content{... on Issue{number title state url}} fieldValueByName(name:"Estado"){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}}}' -F project="$PROJECT_ID")

          CONTEO=$(echo "$ITEMS" | jq -r '
            [.data.node.items.nodes[] | .fieldValueByName.name // "Sin estado"]
            | group_by(.) | map("\(.[0]): \(length)") | join("\n")')

          TERMINADAS_HOY=$(echo "$ITEMS" | jq -r --arg d "$DESDE" '
            [.data.node.items.nodes[] | select(.fieldValueByName.name=="Terminada") | select(.content.state=="CLOSED") | .content]
            | map("- #\(.number) \(.title)") | .[0:20] | join("\n")')

          EN_VALIDACION=$(echo "$ITEMS" | jq -r '
            [.data.node.items.nodes[] | select(.fieldValueByName.name=="En validación") | .content]
            | map("- #\(.number) \(.title) — \(.url)") | join("\n")')

          BLOQUEADAS=$(echo "$ITEMS" | jq -r '
            [.data.node.items.nodes[] | select(.fieldValueByName.name=="Bloqueada") | .content]
            | map("- #\(.number) \(.title) — \(.url)") | join("\n")')

          # Motivo de cada bloqueo: ultimo comentario del issue (si lo hay).
          MOTIVOS=""
          BLOQUEADAS_NUMS=$(echo "$ITEMS" | jq -r '[.data.node.items.nodes[] | select(.fieldValueByName.name=="Bloqueada") | .content.number] | .[]')
          for NUM in $BLOQUEADAS_NUMS; do
            ULTIMO=$(gh issue view "$NUM" --repo "$REPO" --json comments --jq '.comments[-1].body // "(sin comentarios)"' | head -c 300)
            MOTIVOS="${MOTIVOS}#${NUM}: ${ULTIMO}
          "
          done

          # ── Corridas de los workflows del ciclo en las ultimas 24h ──
          RUNS_FALLIDOS=""
          for WF in claude-dev.yml claude-review.yml claude-fix.yml claude-merged.yml; do
            FALLOS=$(gh run list --repo "$REPO" --workflow "$WF" --created ">=${DESDE}" --json conclusion,url,displayTitle,headBranch --jq '[.[] | select(.conclusion=="failure")] | map("  - [\(.displayTitle)](\(.url)) (\(.headBranch))") | join("\n")')
            if [ -n "$FALLOS" ]; then
              RUNS_FALLIDOS="${RUNS_FALLIDOS}**${WF}**:
          ${FALLOS}
          "
            fi
          done
          [ -z "$RUNS_FALLIDOS" ] && RUNS_FALLIDOS="Ninguno."

          DESPACHADAS_HOY=$(gh run list --repo "$REPO" --workflow claude-dev.yml --created ">=${DESDE}" --json conclusion --jq 'length')

          # ── Avance hacia produccion: conteo de "Bloqueador de lanzamiento" por estado ──
          BLOQUEADOR_TERMINADAS=$(gh api graphql -f query='query($project:ID!){node(id:$project){... on ProjectV2{items(first:100){nodes{content{... on Issue{number state}} estado:fieldValueByName(name:"Estado"){... on ProjectV2ItemFieldSingleSelectValue{name}} categoria:fieldValueByName(name:"Categoría"){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}}}' -F project="$PROJECT_ID" \
            | jq -r '[.data.node.items.nodes[] | select(.categoria.name=="Bloqueador de lanzamiento")] | "\( [.[] | select(.estado.name=="Terminada")] | length ) de \( length ) bloqueadores de lanzamiento resueltos"')

          # ── Issues Pendiente sin agent-ready = necesitan decision humana ──
          NECESITAN_DECISION=$(gh issue list --repo "$REPO" --state open --json number,title,labels \
            --jq '[.[] | select([.labels[].name] | index("agent-ready") | not)] | map("- #\(.number) \(.title)") | join("\n")' 2>/dev/null || echo "")

          # ── Siguiente tarea: la activa ahora, o la primera en Lista ──
          ACTIVA_NUM=$(echo "$ITEMS" | jq -r '[.data.node.items.nodes[] | select(.fieldValueByName.name=="En desarrollo" or .fieldValueByName.name=="En revisión") | .content.number] | .[0] // empty')
          if [ -n "$ACTIVA_NUM" ]; then
            SIGUIENTE="Activa ahora mismo: #$ACTIVA_NUM"
          else
            LISTA_NUM=$(echo "$ITEMS" | jq -r '[.data.node.items.nodes[] | select(.fieldValueByName.name=="Lista") | .content.number] | .[0] // empty')
            if [ -n "$LISTA_NUM" ]; then
              SIGUIENTE="Nada activo ahora; el coordinador despachará #$LISTA_NUM en su próximo tick."
            else
              SIGUIENTE="Nada en 'Lista' — el coordinador no despachará nada hasta que claude-triage.yml prepare algo nuevo, o hasta que se resuelva alguna de las decisiones pendientes de abajo."
            fi
          fi

          # ── Armar el cuerpo del comentario ──────────────────────────
          {
            echo "## Resumen — $HOY"
            echo ""
            echo "### Tablero (conteo por estado)"
            echo '```'
            echo "$CONTEO"
            echo '```'
            echo ""
            echo "### Terminadas en las últimas 24h"
            echo "${TERMINADAS_HOY:-Ninguna.}"
            echo ""
            echo "### En validación (esperando confirmación manual/dispositivo)"
            echo "${EN_VALIDACION:-Ninguna.}"
            echo ""
            echo "### Bloqueadas (necesitan decisión humana)"
            echo "${BLOQUEADAS:-Ninguna.}"
            if [ -n "$MOTIVOS" ]; then
              echo ""
              echo "<details><summary>Motivo de cada bloqueo</summary>"
              echo ""
              echo "$MOTIVOS"
              echo "</details>"
            fi
            echo ""
            echo "### Avance hacia producción"
            echo "$BLOQUEADOR_TERMINADAS"
            echo ""
            echo "### Decisiones que necesitas tomar (issues abiertos sin agent-ready)"
            echo "${NECESITAN_DECISION:-Ninguna — todo lo abierto ya está preparado o en curso.}"
            echo ""
            echo "### Siguiente tarea"
            echo "$SIGUIENTE"
            echo ""
            echo "### Corridas del desarrollador despachadas en 24h: $DESPACHADAS_HOY"
            echo ""
            echo "### Fallos de CI/workflow en las últimas 24h"
            echo "$RUNS_FALLIDOS"
            echo ""
            echo "### Límites de gasto"
            echo "Confirmado con el usuario (2026-10-21): autenticación por suscripción (CLAUDE_CODE_OAUTH_TOKEN), no por API de pago — no existe un importe en dólares que definir ni hacer cumplir aquí. Los límites realmente exigibles son estructurales: una tarea activa a la vez, máximo 3 intentos de desarrollo y 3 rondas de corrección por tarea, timeout de 30-60 min por corrida. Si el consumo de la suscripción se agota, las corridas fallarán con un error de autenticación visible en los logs de Actions, nunca en silencio."
            echo ""
            echo "---"
            echo "_Que el ciclo de automatización esté funcionando no significa que MyFitTrack esté listo para producción — eso lo dicen las secciones de arriba, no este pie de página._"
          } > /tmp/reporte.md

          gh issue comment "$REPORT_ISSUE" --repo "$REPO" --body-file /tmp/reporte.md
